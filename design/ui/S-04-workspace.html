<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="devpipe-viewport" content="840x520">
<title>S-04 Design-mode workspace</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="tools.css">
<script src="kit.js"></script>
</head>
<body>
<div class="host" style="width:840px;height:520px">
  <div id="stage" style="position:absolute;inset:0"></div>
  <div class="reserved" style="right:0;bottom:0"></div>
  <div id="mb"></div>
  <div class="ftb" style="left:186px;top:8px">
    <span class="btn icon" data-icon="undo" title="Undo ⌘Z"></span><span class="btn icon dim" data-icon="redo" title="Redo ⇧⌘Z"></span><span class="div"></span>
    <span class="btn" data-icon="alignL">Arrange <span data-icon="chevron" data-size="12"></span></span>
    <span class="btn icon dim" data-icon="group"></span>
    <span class="btn on" data-icon="grid">8</span><span class="btn icon on" data-icon="snap"></span><span class="div"></span>
    <span class="btn raised" data-icon="pages">Main <span data-icon="chevron" data-size="12"></span></span>
    <span class="btn" data-icon="warn" style="color:var(--tool-warning)">1</span>
    <span class="btn icon" data-icon="eye" title="Hide tools (hold H)"></span>
    <span class="btn icon" data-icon="palette" title="Theme"></span><span class="btn icon" data-icon="folder" title="Library"></span>
    <span class="btn primary" data-icon="check">Done</span>
  </div>
  <div class="fpal" style="left:8px;top:58px">
    <span class="btn icon hover" data-icon="knob" data-size="18"></span><span class="btn icon" data-icon="fader" data-size="18"></span><span class="btn icon" data-icon="switch" data-size="18"></span><span class="btn icon" data-icon="xy" data-size="18"></span><span class="btn icon" data-icon="macro" data-size="18"></span><span class="btn icon" data-icon="selector" data-size="18"></span><span class="btn icon" data-icon="menuEl" data-size="18"></span><span class="btn icon" data-icon="tabs" data-size="18"></span>
    <span class="sepr"></span>
    <span class="btn icon" data-icon="scope" data-size="18"></span><span class="btn icon" data-icon="spectrum" data-size="18"></span><span class="btn icon" data-icon="meter" data-size="18"></span><span class="btn icon" data-icon="gr" data-size="18"></span>
    <span class="sepr"></span>
    <span class="btn icon" data-icon="label" data-size="18"></span><span class="btn icon" data-icon="panel" data-size="18"></span><span class="btn icon" data-icon="image" data-size="18"></span>
    <span class="sepr"></span>
    <span class="btn icon" data-icon="curve" data-size="18" title="Reference FX · Transfer curve" style="color:var(--tool-accent)"></span>
  </div>
  <div class="tp float pop arrow-l" style="left:126px;top:70px;width:252px">
    <div class="sec" style="padding:8px 10px 8px 12px"><div class="row"><span data-icon="knob" data-size="16"></span><span class="title">Knob</span><span class="sp"></span><span class="btn icon dim" data-icon="copy" data-size="14" title="Duplicate ⌘D"></span><span class="btn icon dim" data-icon="trash" data-size="14" title="Delete ⌫"></span><span class="btn icon dim" data-icon="close" data-size="14"></span></div></div>
    <div class="sec">
      <div class="acc"><span data-icon="chevron" data-size="12"></span>Binding</div>
      <div class="field" style="margin-bottom:6px"><span data-icon="link" data-size="14" style="color:var(--tool-accent)"></span><span>Filter › Cutoff</span><span style="flex:1"></span><span class="mono muted">cutoff</span></div>
      <div class="row"><span class="muted" style="width:40px">Range</span><div class="range" style="flex:1"><div class="t"></div><div class="f" style="left:10%;right:20%"></div><div class="k" style="left:10%"></div><div class="k" style="left:80%"></div></div></div>
      <div class="row"><span style="width:40px"></span><span class="mono muted">120 Hz</span><span class="sp"></span><span class="mono muted">9.6 kHz</span></div>
      <div class="row"><span class="muted" style="width:40px">Dir.</span><div class="seg" style="flex:1"><span class="on">Normal</span><span>Reversed</span></div></div>
    </div>
    <div class="sec">
      <div class="acc"><span data-icon="chevron" data-size="12"></span>Look</div>
      <div class="row" style="margin-bottom:6px"><span class="muted" style="width:40px">Style</span><div class="seg" style="flex:1"><span class="on">Arc</span><span>Pointer</span><span>Filled</span></div></div>
      <div class="row"><span class="muted" style="width:40px">Arc</span><div class="field" style="flex:1"><span class="swatch" style="background:var(--role-accent-1)"></span>accent-1<span style="flex:1"></span><span data-icon="chevron" data-size="12" class="muted"></span></div></div><div class="row"><span class="muted" style="width:40px">Track</span><div class="field" style="flex:1"><span class="swatch" style="background:var(--role-border)"></span>border<span style="flex:1"></span><span data-icon="chevron" data-size="12" class="muted"></span></div></div>
    </div>
    <div class="sec" style="padding-top:4px;padding-bottom:4px">
      <div class="acc"><span data-icon="chevronR" data-size="12"></span>Frame<span class="sp"></span><span class="mono" style="text-transform:none;letter-spacing:0">40, 88 · 72 × 100</span></div>
      <div class="acc"><span data-icon="chevronR" data-size="12"></span>Shape<span class="sp"></span><span style="text-transform:none;letter-spacing:0">theme</span></div>
      <div class="acc"><span data-icon="chevronR" data-size="12"></span>Caption<span class="sp"></span><span style="text-transform:none;letter-spacing:0">Cutoff</span></div>
    </div>
  </div>
</div>
<script>
  window.mgReady = function () {
    MG.stage({ design: true, grid: true, selected: ["cutoff"], states: { envamt: { state: "unbound", missing: "env_amount" } } });
    document.getElementById("mb").outerHTML = MG.menuButton({ state: "design" });
  };
</script>
</body>
</html>
