[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

# Every crate row of design/STACK.md, pinned exactly. Members use `name.workspace = true`.
[workspace.dependencies]
nice-plug = { version = "=0.4.2", default-features = false, features = ["editor", "zstd"] }
nice-plug-egui = { version = "=0.6.0", features = ["opengl"] }
nice-plug-xtask = "=0.1.1"
egui = { version = "=0.37.0", features = ["default_fonts"] } # egui's Ubuntu Light, Hack and emoji fonts (D-41)
egui_material_icons = "=0.9.0"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
base64 = "=0.23.1"
uuid = { version = "=1.29.3", features = ["v4", "serde"] }
thiserror = "=2.0.21"
arc-swap = "=1.9.5"
rtrb = "=0.4.1"
realfft = "=3.5.1"
png = "=0.18.1"
skrifa = "=0.44.0"
rfd = "=0.18.0"
dirs = "=7.0.0"
proptest = "=1.12.0"
criterion = "=0.8.2"
egui_kittest = { version = "=0.37.0", features = ["snapshot", "wgpu"] }
nice-assert-no-alloc = { version = "=1.0.0", features = ["warn_debug"] }
tempfile = "=3.27.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
